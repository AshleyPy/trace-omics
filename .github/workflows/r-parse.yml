name: R source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    name: Parse R source and run base-R checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Parse every tracked R script
        run: Rscript tests/parse_all.R
      - name: Run base-R contract smoke tests
        run: Rscript tests/test_contract_base.R
